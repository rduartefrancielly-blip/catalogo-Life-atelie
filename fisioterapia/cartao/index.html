<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Letícia Bernucci · Fisioterapia</title>
  <meta name="description" content="Liberação miofascial manual, instrumental e ventosaterapia. Atendimento domiciliar.">
  <meta name="theme-color" content="#3D4A36">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Letícia Bernucci · Fisioterapia">
  <meta property="og:description" content="Liberação miofascial manual · Instrumental · Ventosaterapia · Atendimento domiciliar.">
  <meta property="og:image" content="https://rduartefrancielly-blip.github.io/catalogo-Life-atelie/fisioterapia/cartao/imagens/cartao-link.png">
  <meta property="og:url" content="https://rduartefrancielly-blip.github.io/catalogo-Life-atelie/fisioterapia/cartao/">
  <link rel="icon" href="../img/icone.svg" type="image/svg+xml">
  <style>
    /* Cartão vertical: painel verde-musgo com a marca em cima, painel marfim com serviços e contatos embaixo. */
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: swap; src: url(../fontes/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2"); }
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-display: swap; src: url(../fontes/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2"); }
    @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-display: swap; src: url(../fontes/cormorant-garamond-latin-500-normal.woff2) format("woff2"); }
    @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-display: swap; src: url(../fontes/cormorant-garamond-latin-600-normal.woff2) format("woff2"); }
    :root {
      color-scheme: light;
      --musgo: #3D4A36;
      --musgo-escuro: #27311F;
      --marfim: #FBF8F1;
      --areia: #EFE8DA;
      --dourado: #C9A961;
      --dourado-escuro: #A88845;
      --texto: #23241D;
      --texto-suave: #4E5146;
      --titulo: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --corpo: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; background: var(--areia); color: var(--texto); font-family: var(--corpo); font-size: 1.0625rem; line-height: 1.5;
      display: flex; justify-content: center; align-items: flex-start;
      padding-block: max(24px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--musgo-escuro); outline-offset: 3px; }
    .cartao { width: 100%; max-width: 440px; background: var(--marfim); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 0 rgba(39, 49, 31, .08), 0 18px 40px -24px rgba(39, 49, 31, .45); }

    .frente { position: relative; background: var(--musgo); color: var(--marfim); text-align: center; padding: 44px 24px 40px; }
    .frente::before, .frente::after { content: ""; position: absolute; left: 28px; right: 28px; height: 1px; background: linear-gradient(90deg, transparent, var(--dourado), transparent); }
    .frente::before { top: 16px; }
    .frente::after { bottom: 16px; }
    .monograma { font-family: var(--titulo); font-weight: 500; font-size: 5.6rem; line-height: .9; letter-spacing: -.05em; margin: 0; }
    .regua { width: 56px; height: 1px; background: var(--dourado); margin: 18px auto 16px; border: 0; }
    .nome { font-family: var(--titulo); font-weight: 600; font-size: 1.55rem; letter-spacing: .28em; text-transform: uppercase; margin: 0; padding-left: .28em; text-wrap: balance; }
    .area { font-size: .78rem; letter-spacing: .48em; text-transform: uppercase; margin: 8px 0 0; padding-left: .48em; opacity: .92; }

    .verso { padding: 26px 24px 28px; display: flex; flex-direction: column; gap: 22px; }
    .mensagem { font-family: var(--titulo); font-weight: 600; font-size: 1.85rem; line-height: 1.15; color: var(--musgo-escuro); text-align: center; margin: 6px 0 0; text-wrap: balance; }
    .regua-escura { width: 40px; height: 1px; background: var(--dourado-escuro); border: 0; margin: -4px auto -6px; }
    .servicos { list-style: none; margin: 0 auto; padding: 0; display: flex; flex-direction: column; gap: 10px; width: fit-content; max-width: 100%; }
    .servicos li { display: flex; align-items: center; gap: 14px; font-family: var(--titulo); font-weight: 600; font-size: 1.5rem; line-height: 1.2; color: var(--musgo-escuro); }
    .servicos li::before { content: ""; width: 7px; height: 7px; flex: none; background: var(--dourado-escuro); transform: rotate(45deg); }
    .atendimento { margin: 0; text-align: center; color: var(--texto-suave); font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }

    .acoes { display: flex; flex-direction: column; gap: 10px; }
    .botao {
      display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 10px 18px; border-radius: 12px;
      border: 1.5px solid var(--musgo); background: var(--marfim); color: var(--musgo-escuro); text-decoration: none; font: inherit; text-align: left; cursor: pointer; width: 100%;
    }
    .botao:hover { background: #EEF0E7; }
    .botao-principal { background: var(--musgo); color: var(--marfim); }
    .botao-principal:hover { background: #4C5B44; }
    .botao-textos { display: flex; flex-direction: column; min-width: 0; }
    .botao-titulo { font-weight: 700; }
    .botao-detalhe { font-size: .9rem; opacity: .85; overflow-wrap: anywhere; }
    .icone { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .atendimento .icone { width: 20px; height: 20px; color: var(--dourado-escuro); }
    .aviso { margin: 0; text-align: center; font-weight: 700; color: var(--musgo-escuro); }
    .aviso:empty { display: none; }
    .rodape { margin: 0; padding-top: 16px; border-top: 1px solid #DCD2BE; text-align: center; font-size: .92rem; color: var(--texto-suave); }
    .previa { outline: 2px dashed #A33A2B; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="cartao">
    <header class="frente">
      <p class="monograma" aria-hidden="true">LB</p>
      <hr class="regua">
      <h1 class="nome" id="nome">Letícia Bernucci</h1>
      <p class="area" id="area">Fisioterapia</p>
    </header>
    <div class="verso">
      <h2 class="mensagem" id="mensagem"></h2>
      <hr class="regua-escura">
      <ul class="servicos" id="servicos" aria-label="Serviços"></ul>
      <p class="atendimento" id="atendimento"></p>
      <nav class="acoes" id="acoes" aria-label="Contato"></nav>
      <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
      <p class="rodape" id="rodape"></p>
    </div>
  </main>
  <script src="dados.js"></script>
  <script src="cartao.js"></script>
  <script>
    (function () {
      const { C, icone, telefoneFormatado, linkWhatsapp, linkInstagram, linkEmail, linkTelefone, vcard } = window.Cartao;
      const previa = /[?&]previa=1/.test(location.search);
      const marcar = (valor, texto) => valor || (previa ? texto : "");
      const el = (tag, attrs, ...filhos) => {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
        for (const f of filhos) if (f != null) e.append(f);
        return e;
      };

      document.getElementById("nome").textContent = C.nome || "";
      document.getElementById("area").textContent = C.area || "";
      const msg = document.getElementById("mensagem");
      if (C.mensagem) msg.textContent = C.mensagem; else msg.hidden = true;
      const servicos = document.getElementById("servicos");
      for (const s of C.servicos || []) servicos.append(el("li", null, s));
      if (!servicos.children.length) servicos.hidden = true;
      if (!C.mensagem || !servicos.children.length) document.querySelector(".regua-escura").hidden = true;

      const atend = document.getElementById("atendimento");
      const textoAtend = [C.atendimento, marcar(C.cidade, "[cidade]")].filter(Boolean).join(" · ");
      if (textoAtend) atend.append(icone("casa"), el("span", null, textoAtend)); else atend.hidden = true;

      const acoes = document.getElementById("acoes");
      const aviso = document.getElementById("aviso");
      function botao(o) {
        const b = el(o.href ? "a" : "button", { class: "botao" + (o.principal ? " botao-principal" : "") + (o.previa ? " previa" : ""), href: o.href || null, type: o.href ? null : "button", target: o.novaAba ? "_blank" : null, rel: o.novaAba ? "noopener" : null },
          icone(o.icone), el("span", { class: "botao-textos" }, el("span", { class: "botao-titulo" }, o.titulo), o.detalhe ? el("span", { class: "botao-detalhe" }, o.detalhe) : null));
        if (o.onClick) b.addEventListener("click", o.onClick);
        acoes.append(b);
      }

      if (C.whatsapp) botao({ principal: true, icone: "whatsapp", titulo: "Agendar pelo WhatsApp", detalhe: telefoneFormatado(C.whatsapp), href: linkWhatsapp(), novaAba: true });
      if (C.telefone) botao({ icone: "telefone", titulo: "Ligar", detalhe: telefoneFormatado(C.telefone), href: linkTelefone() });
      if (C.instagram || previa) botao({ icone: "instagram", titulo: "Instagram", detalhe: C.instagram ? "@" + C.instagram.replace(/^@/, "") : "[@ do Instagram]", href: linkInstagram() || "#", novaAba: true, previa: !C.instagram });
      if (C.email) botao({ icone: "email", titulo: "E-mail", detalhe: C.email, href: linkEmail() });
      botao({
        icone: "contato", titulo: "Salvar contato", detalhe: "Adiciona à agenda do celular",
        onClick: () => {
          const url = URL.createObjectURL(new Blob([vcard()], { type: "text/vcard;charset=utf-8" }));
          const a = el("a", { href: url, download: (C.nome || "contato").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "-") + ".vcf" });
          document.body.append(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          aviso.textContent = "Contato baixado. Abra o arquivo para salvar na agenda.";
        }
      });
      botao({
        icone: "compartilhar", titulo: "Compartilhar este cartão", detalhe: "Envie para quem precisa",
        onClick: async () => {
          const link = C.link || location.href;
          if (navigator.share) {
            try { await navigator.share({ title: (C.nome || "") + " · " + (C.area || ""), url: link }); return; } catch (e) { if (e && e.name === "AbortError") return; }
          }
          try { await navigator.clipboard.writeText(link); aviso.textContent = "Link copiado. Cole na conversa para enviar."; }
          catch (e) { aviso.textContent = "Copie o link: " + link; }
        }
      });

      const rodape = [C.nome, C.profissao, marcar(C.registro, "[CREFITO]")].filter(Boolean).join(" · ");
      document.getElementById("rodape").textContent = rodape;
    })();
  </script>
</body>
</html>
