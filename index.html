<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Life Ateliê</title>
  <meta name="description" content="Bolsas artesanais em couro. Escolha a sua e fale com a gente pelo WhatsApp.">
  <meta name="theme-color" content="#FAF7F2">

  <!-- Prévia do link no WhatsApp (a imagem precisa de endereço completo) -->
  <meta property="og:title" content="Catálogo Life Ateliê">
  <meta property="og:description" content="Bolsas artesanais em couro. Escolha a sua e fale com a gente pelo WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rduartefrancielly-blip.github.io/catalogo-Life-atelie/">
  <meta property="og:image" content="https://cdn.shopify.com/s/files/1/0681/1628/3443/files/AF5E81A8-B72E-44FA-A867-CD873D4B1456.jpg?v=1791023952&amp;width=1200">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
  <a class="pular" href="#vitrine">Pular para os produtos</a>

  <header class="topo">
    <p class="marca">Life Ateliê</p>
    <p class="slogan">Catálogo</p>
  </header>

  <div class="barra" id="barra">
    <label class="busca" id="busca-caixa" hidden>
      <span class="sr">Buscar</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input type="search" id="busca" placeholder="Buscar bolsa ou cor" autocomplete="off">
    </label>
    <nav class="filtros" aria-label="Categorias"><div class="filtros-lista" id="filtros"></div></nav>
  </div>

  <main id="vitrine" class="vitrine">
    <p class="contagem" id="contagem" aria-live="polite"></p>
    <ul class="grade" id="grade" aria-busy="true">
      <li class="esqueleto"></li><li class="esqueleto"></li><li class="esqueleto"></li><li class="esqueleto"></li>
    </ul>
  </main>

  <footer class="rodape">
    <p class="marca">Life Ateliê</p>
    <p id="rodape-links"></p>
  </footer>

  <!-- Página do produto -->
  <dialog class="produto" id="produto" aria-labelledby="produto-nome">
    <button class="fechar" type="button" data-fechar aria-label="Fechar">×</button>
    <div class="galeria" id="galeria" aria-label="Fotos. Toque para ampliar."></div>
    <div class="miniaturas" id="miniaturas"></div>
    <div class="produto-info">
      <p class="produto-cat" id="produto-cat"></p>
      <h1 id="produto-nome"></h1>
      <p class="produto-preco" id="produto-preco"></p>
      <fieldset class="variacoes" id="variacoes" hidden>
        <legend id="variacoes-legenda">Escolha uma opção</legend>
        <div class="variacoes-lista" id="variacoes-lista"></div>
      </fieldset>
      <p class="aviso-esgotado" id="aviso-esgotado" hidden>Esgotada no momento — fale com a gente para encomendar.</p>
      <a class="botao botao-whats botao-interesse" id="botao-interesse" target="_blank" rel="noopener"></a>
      <div class="produto-texto" id="produto-texto"></div>
    </div>
  </dialog>

  <!-- Foto ampliada -->
  <dialog class="zoom" id="zoom" aria-label="Foto ampliada">
    <button class="fechar" type="button" data-fechar-zoom aria-label="Fechar foto">×</button>
    <div class="zoom-fotos" id="zoom-fotos"></div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
